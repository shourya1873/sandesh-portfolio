name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Add any build-time environment variables here
          # NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0
          exclude: |
            .git
            .github
            node_modules
            .next
            .env*
            *.log
            .DS_Store

      - name: Execute deployment commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Load environment variables if .env file exists
            if [ -f .env ]; then
              export $(cat .env | grep -v '^#' | xargs)
            fi
            
            # Install/update dependencies
            echo "Installing dependencies..."
            npm ci --production=false
            
            # Build the application
            echo "Building application..."
            npm run build
            
            # Restart PM2 process
            echo "Restarting PM2 process..."
            pm2 restart ${{ secrets.PM2_APP_NAME }} || pm2 start npm --name "${{ secrets.PM2_APP_NAME }}" -- start
            
            # Save PM2 process list
            pm2 save
            
            echo "Deployment completed successfully!"

      - name: Deployment success notification
        if: success()
        run: |
          echo "✅ Deployment to ${{ secrets.SERVER_HOST }} completed successfully!"
          echo "PM2 process '${{ secrets.PM2_APP_NAME }}' has been restarted."

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          exit 1

